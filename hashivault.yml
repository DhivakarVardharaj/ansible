---
- name: Install and configure HashiCorp Vault
  hosts: managed
  become: true

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - gpg
        state: present
        update_cache: true

    - name: Create HashiCorp keyring directory
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: "0755"

    - name: Download HashiCorp signing key
      ansible.builtin.get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /usr/share/keyrings/hashicorp-archive-keyring.asc
        mode: "0644"

    - name: Add HashiCorp repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.asc] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
        filename: hashicorp
        state: present

    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Vault
      ansible.builtin.apt:
        name: vault
        state: present

    - name: Create Vault configuration directory
      ansible.builtin.file:
        path: /etc/vault.d
        state: directory
        owner: vault
        group: vault
        mode: "0750"

    - name: Configure Vault development server
      ansible.builtin.copy:
        dest: /etc/vault.d/vault.hcl
        owner: vault
        group: vault
        mode: "0640"
        content: |
          ui = true
          disable_mlock = true

          storage "inmem" {}

          listener "tcp" {
            address = "127.0.0.1:8200"
            tls_disable = true
          }

          api_addr = "http://127.0.0.1:8200"

    - name: Verify Vault version
      ansible.builtin.command: vault version
      register: vault_version
      changed_when: false

    - name: Display Vault version
      ansible.builtin.debug:
        var: vault_version.stdout

    - name: Display configuration location
      ansible.builtin.debug:
        msg: "Vault configuration created at /etc/vault.d/vault.hcl"
