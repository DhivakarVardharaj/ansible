---
- name: Configure Prometheus and Grafana locally with Docker Compose
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    monitoring_dir: "{{ playbook_dir }}/monitoring"

  tasks:
    - name: Check Docker Compose
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Create monitoring directory
      ansible.builtin.file:
        path: "{{ monitoring_dir }}"
        state: directory
        mode: "0755"

    - name: Create Prometheus configuration
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/prometheus.yml"
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: prometheus
              static_configs:
                - targets: ["prometheus:9090"]

    - name: Create Docker Compose configuration
      ansible.builtin.copy:
        dest: "{{ monitoring_dir }}/compose.yaml"
        mode: "0644"
        content: |
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              restart: unless-stopped
              ports:
                - "127.0.0.1:9090:9090"
              volumes:
                - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - prometheus_data:/prometheus
              command:
                - "--config.file=/etc/prometheus/prometheus.yml"
                - "--storage.tsdb.path=/prometheus"

            grafana:
              image: grafana/grafana-oss:latest
              container_name: grafana
              restart: unless-stopped
              ports:
                - "127.0.0.1:3000:3000"
              volumes:
                - grafana_data:/var/lib/grafana
              depends_on:
                - prometheus

          volumes:
            prometheus_data:
            grafana_data:

    - name: Validate Docker Compose configuration
      ansible.builtin.command:
        cmd: docker compose -f compose.yaml config --quiet
        chdir: "{{ monitoring_dir }}"
      changed_when: false

    - name: Start Prometheus and Grafana
      ansible.builtin.command:
        cmd: docker compose -f compose.yaml up -d
        chdir: "{{ monitoring_dir }}"
      register: compose_up
      changed_when: true

    - name: Check container status
      ansible.builtin.command:
        cmd: docker compose -f compose.yaml ps
        chdir: "{{ monitoring_dir }}"
      register: compose_status
      changed_when: false

    - name: Display container status
      ansible.builtin.debug:
        var: compose_status.stdout_lines

    - name: Display service URLs
      ansible.builtin.debug:
        msg:
          - "Prometheus: http://localhost:9090"
          - "Grafana: http://localhost:3000"
          - "Default Grafana login is usually admin / admin."
