---
- name: Configure Prometheus and Grafana
  hosts: managed
  become: true
  gather_facts: false

  tasks:
    - name: Create monitoring directory
      ansible.builtin.file:
        path: /opt/monitoring
        state: directory
        mode: "0755"

    - name: Create Prometheus configuration
      ansible.builtin.copy:
        dest: /opt/monitoring/prometheus.yml
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: prometheus
              static_configs:
                - targets: ["localhost:9090"]

    - name: Create Docker Compose configuration
      ansible.builtin.copy:
        dest: /opt/monitoring/compose.yaml
        mode: "0644"
        content: |
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              restart: unless-stopped
              ports:
                - "9090:9090"
              volumes:
                - /opt/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - prometheus_data:/prometheus
            grafana:
              image: grafana/grafana-oss:latest
              container_name: grafana
              restart: unless-stopped
              ports:
                - "3000:3000"
              volumes:
                - grafana_data:/var/lib/grafana
          volumes:
            prometheus_data:
            grafana_data:

    - name: Start Prometheus and Grafana
      ansible.builtin.command:
        cmd: docker compose -f /opt/monitoring/compose.yaml up -d

    - name: Verify containers
      ansible.builtin.command:
        cmd: docker ps --filter name=prometheus --filter name=grafana
      register: result
      changed_when: false

    - name: Display container status
      ansible.builtin.debug:
        var: result.stdout_lines
